name: Build and test Android source

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Pinned immutable revisions; update only through a reviewed dependency change.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Install SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Test host tooling
        run: |
          python3 tools/check_version_consistency.py
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
          bash -n tools/*.sh verification/service-tests/run.sh
          pwsh -NoProfile -Command '$errors = $null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "tools/install.ps1"), [ref]$null, [ref]$errors) > $null; if ($errors.Count) { $errors | Out-String | Write-Error; exit 1 }'
      - name: Compile, unit-test, service-test and lint
        run: bash gradlew :core:check :app:ktlintCheck :app:assembleDebug :app:testDebugUnitTest :verification:service-tests:ktlintCheck :verification:service-tests:run :app:lintDebug --stacktrace --console=plain
      - name: Verify APK signature and manifest identity
        env:
          REPORT_FILE: verification/current/apk-verification.txt
        run: bash tools/verify-apk.sh app/build/outputs/apk/debug/app-debug.apk org.carcallrouter.companion 6 0.3.0-beta.4 34 36 true
      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: car-call-router-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            verification/current/apk-verification.txt
          if-no-files-found: error
          retention-days: 14
