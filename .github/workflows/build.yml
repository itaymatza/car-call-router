name: Build and test Android source

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  merge_group:
    branches: [main]

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host-contract:
    name: Host contracts (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Test policy, service callback, trace, and capture contracts
        run: |
          python3 -m unittest tools.tests.test_analyze_device_trace tools.tests.test_capture_device_run tools.tests.test_extract_new_app_events
          bash gradlew :core:test :verification:service-tests:test --stacktrace --console=plain

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Pinned immutable revisions; update only through a reviewed dependency change.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Install SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Test host tooling
        run: |
          python3 tools/check_version_consistency.py
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
          bash -n tools/*.sh verification/service-tests/run.sh
          pwsh -NoProfile -Command '$errors = $null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "tools/install.ps1"), [ref]$null, [ref]$errors) > $null; if ($errors.Count) { $errors | Out-String | Write-Error; exit 1 }'
      - name: Compile, unit-test, service-test and lint
        run: bash gradlew :core:check :app:ktlintCheck :app:assembleDebug :app:testDebugUnitTest :verification:service-tests:check :app:lintDebug --stacktrace --console=plain
      - name: Publish coverage summary
        run: >-
          python3 tools/summarize_coverage.py
          --report core=core/build/reports/jacoco/test/jacocoTestReport.xml
          --report service=verification/service-tests/build/reports/jacoco/test/jacocoTestReport.xml
          --output "$GITHUB_STEP_SUMMARY"
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-and-coverage-reports
          path: |
            core/build/reports/jacoco/test/
            core/build/test-results/test/
            verification/service-tests/build/reports/jacoco/test/
            verification/service-tests/build/test-results/test/
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
      - name: Verify APK signature and manifest identity
        env:
          REPORT_FILE: verification/current/apk-verification.txt
        run: bash tools/verify-apk.sh app/build/outputs/apk/debug/app-debug.apk org.carcallrouter.companion 14 0.3.0-beta.12 34 36 true
      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: car-call-router-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            verification/current/apk-verification.txt
          if-no-files-found: error
          retention-days: 14
