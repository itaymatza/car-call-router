name: Publish direct-download debug beta

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: publish-debug-prerelease
  cancel-in-progress: false

env:
  BASE_VERSION_CODE: '14'
  BASE_VERSION_NAME: 0.3.0-beta.12

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: debug-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Require protected debug signing secrets
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
          DEBUG_SIGNING_CERT_SHA256: ${{ vars.DEBUG_SIGNING_CERT_SHA256 }}
        run: |
          for name in DEBUG_KEYSTORE_BASE64 DEBUG_KEYSTORE_PASSWORD DEBUG_KEY_ALIAS DEBUG_KEY_PASSWORD DEBUG_SIGNING_CERT_SHA256; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configure $name in the debug-signing environment before publishing APKs."
              exit 1
            fi
          done
      - name: Install SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Identify this source build
        run: |
          short_sha="${GITHUB_SHA:0:12}"
          echo "VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${BASE_VERSION_NAME}.${short_sha}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v${BASE_VERSION_NAME}-debug.${short_sha}" >> "$GITHUB_ENV"
          echo "APK_NAME=car-call-router-${BASE_VERSION_NAME}-debug.${short_sha}.apk" >> "$GITHUB_ENV"
      - name: Test host tooling
        run: |
          python3 tools/check_version_consistency.py
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
          bash -n tools/*.sh verification/service-tests/run.sh
      - name: Materialize temporary signing keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/car-call-router-debug.jks"
      - name: Build and verify debug beta
        env:
          BETA_KEYSTORE_FILE: ${{ runner.temp }}/car-call-router-debug.jks
          BETA_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          BETA_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          BETA_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        run: >-
          bash gradlew
          :core:check
          :app:ktlintCheck
          :app:assembleDebug
          :app:testDebugUnitTest
          :verification:service-tests:ktlintCheck
          :verification:service-tests:run
          :app:lintDebug
          -PENABLE_BETA_SIGNING=true
          -PAPP_VERSION_CODE="$VERSION_CODE"
          -PAPP_VERSION_NAME="$VERSION_NAME"
          --stacktrace --console=plain
      - name: Verify APK identity
        env:
          REPORT_FILE: dist/apk-verification.txt
          EXPECTED_CERT_SHA256: ${{ vars.DEBUG_SIGNING_CERT_SHA256 }}
        run: >-
          bash tools/verify-apk.sh
          app/build/outputs/apk/debug/app-debug.apk
          org.carcallrouter.companion
          "$VERSION_CODE"
          "$VERSION_NAME"
          34 36 true
      - name: Prepare direct-download assets
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "dist/$APK_NAME"
          (cd dist && sha256sum "$APK_NAME" > "$APK_NAME.sha256")
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ env.APK_NAME }}
      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release for this source commit already exists: $RELEASE_TAG"
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            "dist/$APK_NAME" \
            "dist/$APK_NAME.sha256" \
            dist/apk-verification.txt \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Car Call Router $VERSION_NAME (debug beta)" \
            --notes-file docs/DEBUG-PRERELEASE-NOTES.md
      - name: Remove temporary signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/car-call-router-debug.jks"
